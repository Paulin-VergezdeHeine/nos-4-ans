<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1026" />
    <title>Nos 4 ans</title>
    <meta
      name="description"
      content="Quatre années, et seulement le début."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Canvas des particules (pétales) en fond -->
    <canvas id="petals" aria-hidden="true"></canvas>

    <!-- Barre de progression de lecture -->
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <!-- ░░ INTRO ░░ -->
    <header class="hero" id="hero">
      <div class="hero__glow" aria-hidden="true"></div>
      <p class="hero__eyebrow" data-reveal id="heroNames"></p>
      <h1 class="hero__title" id="heroTitle"></h1>
      <p class="hero__subtitle" data-reveal id="heroSubtitle"></p>

      <div class="counter" id="counter" data-reveal aria-live="polite">
        <div class="counter__unit">
          <span class="counter__value" id="cDays">—</span>
          <span class="counter__label">jours</span>
        </div>
        <div class="counter__unit">
          <span class="counter__value" id="cHours">—</span>
          <span class="counter__label">heures</span>
        </div>
        <div class="counter__unit">
          <span class="counter__value" id="cMin">—</span>
          <span class="counter__label">minutes</span>
        </div>
        <div class="counter__unit">
          <span class="counter__value" id="cSec">—</span>
          <span class="counter__label">secondes</span>
        </div>
      </div>
      <p class="counter__caption" data-reveal>… que mon cœur bat pour le tien.</p>

      <a class="scroll-cue" href="#timeline" aria-label="Faire défiler">
        <span></span>
      </a>
    </header>

    <!-- ░░ FRISE DES SOUVENIRS ░░ -->
    <section class="section" id="timeline">
      <h2 class="section__title" data-reveal>Notre histoire</h2>
      <div class="timeline" id="timelineList"></div>
    </section>

    <!-- ░░ RAISONS ░░ -->
    <section class="section reasons" id="reasons">
      <h2 class="section__title" data-reveal>Ce que j'aime, c'est…</h2>
      <p class="reasons__rotator" id="reasonText" data-reveal>&nbsp;</p>
      <div class="reasons__dots" id="reasonDots" aria-hidden="true"></div>
    </section>

    <!-- ░░ LETTRE ░░ -->
    <section class="section letter" id="letter">
      <article class="letter__paper" data-reveal>
        <div class="letter__body" id="letterBody"></div>
        <p class="letter__sign" id="letterSign"></p>
      </article>
    </section>

    <!-- ░░ FINAL ░░ -->
    <footer class="finale" id="finale">
      <button class="heart-btn" id="heartBtn" aria-label="Envoyer de l'amour">
        <svg viewBox="0 0 32 29" width="48" height="44" aria-hidden="true">
          <path
            d="M16 28S2 18.6 2 9.6C2 5 5.6 1.6 9.8 1.6c2.6 0 5 1.4 6.2 3.6 1.2-2.2 3.6-3.6 6.2-3.6C26.4 1.6 30 5 30 9.6 30 18.6 16 28 16 28z"
          />
        </svg>
      </button>
      <p class="finale__text" data-reveal>Appuie sur le cœur.</p>
      <p class="finale__credit" data-reveal>Fait avec amour, rien que pour toi.</p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
