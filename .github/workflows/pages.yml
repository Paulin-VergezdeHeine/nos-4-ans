name: Déploiement GitHub Pages

# Publie le site statique sur GitHub Pages à chaque push sur la branche du projet.
# `enablement: true` active automatiquement Pages s'il ne l'est pas encore,
# donc aucun réglage manuel n'est nécessaire.

on:
  push:
    branches: [claude/new-project-brainstorm-y6y92y]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages (et l'activer si besoin)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
